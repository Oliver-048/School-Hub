<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School Hub</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#d3dbe8;--hi:#ffd84d;--acc:#2a5bd7;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1622;--card:#182233;--ink:#e8eefb;--mute:#93a3bf;--line:#2b3a52;--acc:#7da2ff;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:1.7rem}
h1 span{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}
h2{font-size:1.15rem;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:6px 16px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 11px}
button:hover{border-color:var(--acc)}
button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
button.del{color:var(--bad);padding:2px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li a{color:var(--acc);font-weight:bold;text-decoration:none;word-break:break-word}
li a:hover{text-decoration:underline}
.grow{flex:1;min-width:0}
.meta{font-size:.85rem;color:var(--mute)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:6px}
.tag.test{background:var(--hi);color:#14213d;border-color:var(--hi)}
.done .t{text-decoration:line-through;color:var(--mute)}
.soon{color:var(--bad);font-weight:bold}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none}
.add{display:none;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.editing .add{display:flex}
.add input,.add select{flex:1 1 120px}
.del,.editonly{display:none}
.editing .del,.editing .editonly{display:inline-block}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.empty{color:var(--mute);font-style:italic}
#msg{min-height:1.4em;color:var(--mute);font-size:.9rem;margin-top:10px}
.hidden{display:none}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:.8rem;color:var(--mute);padding:2px 0}
.day{min-height:84px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px;overflow:hidden}
.day.out{opacity:.45}
.day.today{border:2px solid var(--acc)}
.day .n{font-size:.8rem;font-weight:bold;color:var(--mute)}
.chip{display:block;width:100%;text-align:left;font-size:.72rem;line-height:1.2;margin-top:2px;padding:2px 4px;border-radius:4px;border:0;background:var(--acc);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.test{background:var(--hi);color:#14213d}
.chip.fin{opacity:.5;text-decoration:line-through}
@media(max-width:600px){.day{min-height:60px}.chip{font-size:.62rem}}
</style>
</head>
<body>
<main>
  <header>
    <h1><span>My School Hub</span></h1>
    <button id="lock" class="main"></button>
  </header>
  <div class="tabs" role="tablist">
    <button id="tList" class="on">List</button>
    <button id="tCal">Calendar</button>
  </div>

  <div id="vList" class="grid">
    <section>
      <h2>School links</h2>
      <ul id="links"></ul>
      <div class="add">
        <input id="ln" placeholder="Name (e.g. Gradebook)">
        <input id="lu" placeholder="Web address">
        <button id="la" class="main">Add link</button>
      </div>
    </section>
    <section>
      <h2>Upcoming events and tests</h2>
      <ul id="events"></ul>
      <div class="add">
        <input id="en" placeholder="Title (e.g. Math unit test)">
        <input id="ed" type="date" aria-label="Date (first date for weekly events)">
        <select id="et" aria-label="Type"><option>Test</option><option>Event</option><option>Assignment</option></select>
        <select id="er" aria-label="Repeat"><option value="">One time</option><option value="w">Every week</option></select>
        <button id="ea" class="main">Add event</button>
      </div>
    </section>
  </div>

  <section id="vCal" class="hidden">
    <div class="calhead">
      <button id="cp" aria-label="Previous month">&lt;</button>
      <h2 id="cm"></h2>
      <button id="cn" aria-label="Next month">&gt;</button>
      <button id="ct">Today</button>
    </div>
    <div id="cal" class="cal"></div>
    <p class="meta">Click an event on the calendar to mark it done or not done.</p>
  </section>

  <div class="bar">
    <button id="exp">Download backup</button>
    <button id="imp">Restore backup</button>
    <button id="clr">Hide finished events</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <div id="msg" role="status"></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var data={links:[],events:[]}, editing=false, hideDone=false, view="list", cal=new Date(), entry="", editPw="", poll=null;
cal.setDate(1);
function say(t){$("msg").textContent=t}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fixUrl(u){u=u.trim();if(!u)return"";return /^https?:\/\//i.test(u)?u:"https://"+u}

/* server */
function api(method,path,body,useEdit){
  return fetch("/api/hub"+path,{method:method,headers:{"Content-Type":"application/json","x-entry":entry,"x-edit":useEdit?editPw:""},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(j){j.ok=r.ok;j.status=r.status;return j})})}
function save(){return api("PUT","",{data:data},true).then(function(j){if(!j.ok)say(j.status===401?"Editing password rejected. Lock and unlock again.":"Could not save to the server.")}).catch(function(){say("Could not reach the server.")})}
function toggle(i,d,v){var e=data.events[i];setDone(e,d,v);render();
  api("POST","/check",{i:i,n:e.n,d:d,v:v}).then(function(j){if(!j.ok)say("Could not save that tick. Refresh and try again.")}).catch(function(){say("Could not reach the server.")})}

/* dates */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){return new Date(s+"T00:00:00")}
function todayIso(){return iso(new Date())}
function daysLeft(d){var t=new Date();t.setHours(0,0,0,0);return Math.round((parse(d)-t)/864e5)}
function when(d){if(!d)return"No date";var n=daysLeft(d),s=parse(d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(n<0)return s+" (past)";if(n===0)return'<span class="soon">Today</span> ('+s+")";if(n===1)return'<span class="soon">Tomorrow</span> ('+s+")";
  if(n<=3)return'<span class="soon">In '+n+" days</span> ("+s+")";return s+" (in "+n+" days)"}
function isDone(e,d){return e.r?!!(e.dn&&e.dn[d]):!!e.done}
function setDone(e,d,v){if(e.r){e.dn=e.dn||{};if(v)e.dn[d]=1;else delete e.dn[d]}else e.done=v}
function occursOn(e,d){if(!e.d)return false;if(!e.r)return e.d===d;return d>=e.d&&Math.round((parse(d)-parse(e.d))/864e5)%7===0}
function nextOcc(e){if(!e.r)return e.d;var t=todayIso();if(t<=e.d)return e.d;var diff=Math.round((parse(t)-parse(e.d))/864e5),add=(7-diff%7)%7,d=parse(t);d.setDate(d.getDate()+add);return iso(d)}

/* passwords */
function unlock(){var p=prompt("Enter your editing password:");if(p===null)return;editPw=p;
  api("GET","",null,true).then(function(j){if(j.ok&&j.canEdit){editing=true;say("Editing unlocked.")}else{editPw="";say("Wrong password.")}render()}).catch(function(){say("Could not reach the server.")})}
function lock(){editing=false;editPw="";say("Locked.");render()}
function tryEnter(pw){entry=pw;
  return api("GET","").then(function(j){
    if(j.ok){data=j.data;try{sessionStorage.setItem("shEntry",pw)}catch(e){}
      $("gate").className="hidden";$("site").className="";render();
      poll=setInterval(function(){if(editing)return;api("GET","").then(function(r){if(r.ok){data=r.data;render()}}).catch(function(){})},30000);return true}
    entry="";return false}).catch(function(){entry="";return null})}

/* render */
function render(){
  document.body.className=editing?"editing":"";
  $("lock").textContent=editing?"Lock editing":"Unlock to edit";
  $("clr").textContent=hideDone?"Show finished events":"Hide finished events";
  $("vList").className=view==="list"?"grid":"hidden";
  $("vCal").className=view==="cal"?"":"hidden";
  $("tList").className=view==="list"?"on":"";
  $("tCal").className=view==="cal"?"on":"";
  $("links").innerHTML=data.links.length?data.links.map(function(l,i){
    return '<li><div class="grow"><a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.n)+'</a></div><button class="del" data-l="'+i+'" aria-label="Delete link">Delete</button></li>'}).join(""):'<li class="empty">No links yet. Unlock to add some.</li>';
  var ev=data.events.map(function(e,i){return{e:e,i:i,d:nextOcc(e)}}).filter(function(x){return!(hideDone&&isDone(x.e,x.d))});
  ev.sort(function(a,b){return(a.d||"9999").localeCompare(b.d||"9999")});
  $("events").innerHTML=ev.length?ev.map(function(x){var e=x.e,dn=isDone(e,x.d);
    return '<li class="'+(dn?"done":"")+'"><input type="checkbox" data-c="'+x.i+'" data-d="'+(x.d||"")+'"'+(dn?" checked":"")+' aria-label="Mark done"><div class="grow"><div class="t">'+esc(e.n)+'<span class="tag'+(e.t==="Test"?" test":"")+'">'+esc(e.t)+'</span>'+(e.r?'<span class="tag">Weekly</span>':"")+'</div><div class="meta">'+when(x.d)+'</div></div><button class="del" data-e="'+x.i+'" aria-label="Delete event">Delete</button></li>'}).join(""):'<li class="empty">Nothing coming up. Unlock to add events and tests.</li>';
  if(view==="cal")renderCal()}

function renderCal(){
  var y=cal.getFullYear(),m=cal.getMonth();
  $("cm").textContent=cal.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  var h="",names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  names.forEach(function(n){h+='<div class="dow">'+n+"</div>"});
  var start=new Date(y,m,1-new Date(y,m,1).getDay()),t=todayIso();
  for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var ds=iso(d);
    if(i>=35&&d.getMonth()!==m)break;
    var chips="";
    data.events.forEach(function(e,idx){if(occursOn(e,ds)){var dn=isDone(e,ds);
      chips+='<button class="chip'+(e.t==="Test"?" test":"")+(dn?" fin":"")+'" data-cc="'+idx+'" data-cd="'+ds+'" title="'+esc(e.n)+(e.r?" (weekly)":"")+'">'+esc(e.n)+"</button>"}});
    h+='<div class="day'+(d.getMonth()!==m?" out":"")+(ds===t?" today":"")+'"><div class="n">'+d.getDate()+"</div>"+chips+"</div>"}
  $("cal").innerHTML=h}

/* events */
document.addEventListener("click",function(ev){var t=ev.target;
  if(t.dataset.l!==undefined&&editing){data.links.splice(+t.dataset.l,1);save();render()}
  if(t.dataset.e!==undefined&&editing){data.events.splice(+t.dataset.e,1);save();render()}
  if(t.dataset.cc!==undefined){var e=data.events[+t.dataset.cc],d=t.dataset.cd;toggle(+t.dataset.cc,d,!isDone(e,d))}});
document.addEventListener("change",function(ev){var t=ev.target;
  if(t.dataset.c!==undefined)toggle(+t.dataset.c,t.dataset.d,t.checked)});
$("lock").onclick=function(){editing?lock():unlock()};
$("tList").onclick=function(){view="list";render()};
$("tCal").onclick=function(){view="cal";render()};
$("cp").onclick=function(){cal.setMonth(cal.getMonth()-1);renderCal()};
$("cn").onclick=function(){cal.setMonth(cal.getMonth()+1);renderCal()};
$("ct").onclick=function(){cal=new Date();cal.setDate(1);renderCal()};
$("la").onclick=function(){if(!editing)return;var n=$("ln").value.trim(),u=fixUrl($("lu").value);
  if(!n||!u){say("Enter a name and a web address.");return}
  data.links.push({n:n,u:u});$("ln").value=$("lu").value="";save();render();say("Link added.")};
$("ea").onclick=function(){if(!editing)return;var n=$("en").value.trim(),rep=$("er").value==="w";
  if(!n){say("Enter a title for the event.");return}
  if(rep&&!$("ed").value){say("Pick the first date for a weekly event.");return}
  var e={n:n,d:$("ed").value,t:$("et").value};if(rep){e.r=1;e.dn={}}else e.done=false;
  data.events.push(e);$("en").value=$("ed").value="";$("er").value="";save();render();say(rep?"Weekly event added.":"Event added.")};
$("clr").onclick=function(){hideDone=!hideDone;render()};
$("exp").onclick=function(){var b=new Blob([JSON.stringify({data:data})],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="school-hub-backup.json";a.click();say("Backup downloaded. Keep it somewhere safe.")};
$("imp").onclick=function(){if(!editing){say("Unlock editing first to restore a backup.");return}$("file").click()};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o.data||!o.data.links||!o.data.events)throw 0;data=o.data;save().then(function(){render();say("Backup restored and saved to the server.")})}catch(e){say("That file is not a valid backup.")}};
  r.readAsText(f);this.value=""};

/* entry gate */
function gateTry(){var pw=$("gp").value;tryEnter(pw).then(function(ok){
  if(ok===false){$("gm").textContent="Wrong password.";$("gp").value="";$("gp").focus()}
  else if(ok===null)$("gm").textContent="Could not reach the server."})}
$("gb").onclick=gateTry;
$("gp").onkeydown=function(e){if(e.key==="Enter")gateTry()};
try{var saved=sessionStorage.getItem("shEntry");if(saved)tryEnter(saved)}catch(e){}
})();
</script>
</body>
</html>
